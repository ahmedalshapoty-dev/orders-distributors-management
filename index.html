<script>
const api =
"https://api.github.com/repos/ahmedalshapoty-dev/orders-distributors-management/contents/";

let images = [];
let current = 0;
let isLoading = false;

const imgElement = document.getElementById("projectImage");
const filenameElement = document.getElementById("filename");
const counterElement = document.getElementById("counter");

// حتى يظهر العداد بالترتيب الصحيح رغم أن الصفحة عربية
counterElement.style.direction = "ltr";

fetch(api)
.then(response => response.json())
.then(files => {

    images = files.filter(file => {
        const name = file.name.toLowerCase();

        return (
            name.endsWith(".png") ||
            name.endsWith(".jpg") ||
            name.endsWith(".jpeg") ||
            name.endsWith(".webp")
        );
    });

    // الشاشة الرئيسية أول صورة
    images.sort((a, b) => {

        const aMain = a.name.includes("الرئيس");
        const bMain = b.name.includes("الرئيس");

        if (aMain && !bMain) return -1;
        if (!aMain && bMain) return 1;

        return a.name.localeCompare(b.name, "ar");
    });

    if (images.length === 0) {
        document.getElementById("loading").innerText =
        "لا توجد صور.";
        return;
    }

    document.getElementById("loading").style.display = "none";
    document.getElementById("galleryContent").style.display = "block";

    showImage();

})
.catch(() => {
    document.getElementById("loading").innerText =
    "حدث خطأ أثناء تحميل الصور.";
});


function showImage() {

    if (images.length === 0) return;

    const image = images[current];

    isLoading = true;

    // نعرض اسم الصورة والعداد مباشرة
    filenameElement.innerText = image.name;
    counterElement.innerText =
        (current + 1) + " / " + images.length;

    imgElement.style.opacity = "0.5";

    imgElement.onload = function() {

        imgElement.style.opacity = "1";
        isLoading = false;

        // تحميل الصورة التالية والسابقة مسبقاً
        preloadNearbyImages();
    };

    imgElement.onerror = function() {

        isLoading = false;
        imgElement.style.opacity = "1";
    };

    imgElement.src = image.download_url;
}


function preloadNearbyImages() {

    const nextIndex =
        (current + 1) % images.length;

    const previousIndex =
        (current - 1 + images.length) % images.length;

    const nextImage = new Image();
    nextImage.src =
        images[nextIndex].download_url;

    const previousImage = new Image();
    previousImage.src =
        images[previousIndex].download_url;
}


function nextImage() {

    current =
        (current + 1) % images.length;

    showImage();
}


function previousImage() {

    current =
        (current - 1 + images.length) % images.length;

    showImage();
}


// أسهم الكيبورد
document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") {
        nextImage();
    }

    if (event.key === "ArrowLeft") {
        previousImage();
    }

});

</script>
